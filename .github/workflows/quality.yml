name: Quality

on:
  # main ブランチ への push があった場合実行
  push:
    branches:
      - main
  # 対象の pash の変更を含み main ブランチ への pull request があった場合に実行
  pull_request:
    paths:
      - "packages/**"
      - "examples/**"
      - "package.json"
      - ".node-version"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/quality.yml"
      - ".github/actions/**"
    branches:
      - main
  workflow_dispatch:

# 同時に実行できるジョブの数を制限(同一ブランチ名のジョブが実行された場合以前のジョブをキャンセルする)
# ※ main ブランチだけはキャンセルしない
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup
      uses: ./.github/actions/setup
    - name: Run lint, typecheck and tests
      run: pnpm run ci
    - name: Build packages and examples
      run: pnpm run build
