<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>digital-go-jp-panda-preset Studio</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-family: 'Noto Sans JP', system-ui, sans-serif;
        line-height: 1.7;
      }
      main { max-width: 36rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      a { color: #0017c1; }
      @media (prefers-color-scheme: dark) { a { color: #9db7f9; } }
    </style>
  </head>
  <body>
    <main>
      <h1>@togana/digital-go-jp-panda-preset</h1>
      <p>Panda Studio でトークン一覧を開いています…</p>
      <p>
        自動で移動しない場合は <a id="studio" href="https://studio.panda-css.com/">Panda Studio で開く</a>
        か、<a href="design-system.json">design-system.json</a> を直接参照してください。
      </p>
    </main>
    <script>
      // 同じ場所に置いた design-system.json を、ホスト版の Panda Studio で開く
      const spec = new URL('design-system.json', location.href).href;
      const studio = `https://studio.panda-css.com/#url=${encodeURIComponent(spec)}`;
      document.getElementById('studio').href = studio;
      location.replace(studio);
    </script>
  </body>
</html>
